<script>
__CURRENT_PRODUCT_JS__
window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:'view_item',ecommerce:{currency:'CLP',value:CURRENT_PRODUCT.price,items:[{item_id:CURRENT_PRODUCT.id,item_name:CURRENT_PRODUCT.name,item_category:"__VIEW_ITEM_CATEGORY__",price:CURRENT_PRODUCT.price,quantity:1}]}});
document.addEventListener('DOMContentLoaded',()=>{document.querySelector('.product-thumbs img')?.classList.add('active');});
async function addCurrentProduct(){try{const r=await fetch('/api/stock-get');const d=await r.json();if(d.stock)localStorage.setItem('pac_stock',JSON.stringify(d.stock));}catch(e){}addToCart(CURRENT_PRODUCT);document.getElementById('product-msg').textContent='✓ Producto añadido al carrito';window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:'add_to_cart',ecommerce:{currency:'CLP',value:CURRENT_PRODUCT.price,items:[{item_id:CURRENT_PRODUCT.id,item_name:CURRENT_PRODUCT.name,price:CURRENT_PRODUCT.price,quantity:1}]}});}
function changeProductImage(el){document.getElementById('product-main-img').src=el.src;document.querySelectorAll('.product-thumbs img').forEach(x=>x.classList.remove('active'));el.classList.add('active');}
function switchProductTab(button){
  const tabs=button.closest('.product-info-tabs');
  if(!tabs) return;
  tabs.querySelectorAll('.product-tab-btn').forEach(btn=>{
    btn.classList.remove('activo');
    btn.setAttribute('aria-selected','false');
  });
  tabs.querySelectorAll('.product-tab-panel').forEach(panel=>panel.classList.remove('activo'));
  button.classList.add('activo');
  button.setAttribute('aria-selected','true');
  const panel=document.getElementById(button.getAttribute('aria-controls'));
  if(panel) panel.classList.add('activo');
}
</script>
